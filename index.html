<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل بيانات المدرسين - دار الفائز</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 50%, #7e22ce 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 650px;
            width: 100%;
            overflow: hidden;
        }

        .header-section {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            padding: 40px 30px;
            text-align: center;
        }

        .main-title {
            font-size: 42px;
            font-weight: 800;
            color: #ffffff;
            margin-bottom: 15px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .subtitle {
            font-size: 22px;
            font-weight: 600;
            color: #fbbf24;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.2);
        }

        .form-section {
            padding: 40px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
            font-size: 14px;
        }

        label .required {
            color: #e74c3c;
            margin-right: 3px;
        }

        input[type="text"],
        input[type="email"],
        input[type="tel"],
        select {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.3s;
            font-family: inherit;
        }

        select[multiple] {
            padding: 8px;
        }

        select[multiple] option {
            padding: 8px 12px;
            margin: 2px 0;
            border-radius: 4px;
        }

        select[multiple] option:checked {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: #1e3c72;
            box-shadow: 0 0 0 3px rgba(30, 60, 114, 0.1);
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        input[type="checkbox"] {
            width: 20px;
            height: 20px;
            cursor: pointer;
            accent-color: #1e3c72;
        }

        button {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 20px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(30, 60, 114, 0.4);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .message {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
            font-weight: 600;
            display: none;
        }

        .success-message {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .error-message {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .loading {
            display: none;
            text-align: center;
            margin-top: 10px;
            color: #1e3c72;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header-section">
            <h1 class="main-title">📝 تسجيل بيانات المدرسين</h1>
            <p class="subtitle">📚 دار الفائز للطبع والنشر والتوزيع</p>
        </div>
        
        <div class="form-section">
            <div class="success-message message" id="successMessage">
                ✅ تم إرسال البيانات بنجاح!
            </div>
            
            <div class="error-message message" id="errorMessage">
                ❌ حدث خطأ أثناء الإرسال. يرجى المحاولة مرة أخرى.
            </div>

            <form id="registrationForm">
                <!-- الاسم -->
                <div class="form-group">
                    <label for="name">
                        <span class="required">*</span>
                        👤 الاسم الكامل
                    </label>
                    <input type="text" id="name" name="name" required placeholder="أدخل الاسم الكامل">
                </div>

                <!-- العنوان -->
                <div class="form-group">
                    <label for="address">
                        <span class="required">*</span>
                        📍 العنوان
                    </label>
                    <input type="text" id="address" name="address" required placeholder="أدخل العنوان">
                </div>

                <!-- رقم الهاتف -->
                <div class="form-group">
                    <label for="phone">
                        <span class="required">*</span>
                        📱 رقم الهاتف
                    </label>
                    <input type="tel" id="phone" name="phone" required placeholder="01xxxxxxxxx">
                </div>

                <!-- المحافظة -->
                <div class="form-group">
                    <label for="governorate">
                        <span class="required">*</span>
                        🏙️ المحافظة
                    </label>
                    <select id="governorate" name="governorate" required>
                        <option value="">اختر المحافظة</option>
                        <option value="القاهرة">القاهرة</option>
                        <option value="الجيزة">الجيزة</option>
                        <option value="الإسكندرية">الإسكندرية</option>
                        <option value="الدقهلية">الدقهلية</option>
                        <option value="البحيرة">البحيرة</option>
                        <option value="الشرقية">الشرقية</option>
                        <option value="القليوبية">القليوبية</option>
                        <option value="كفر الشيخ">كفر الشيخ</option>
                        <option value="الغربية">الغربية</option>
                        <option value="المنوفية">المنوفية</option>
                        <option value="دمياط">دمياط</option>
                        <option value="بورسعيد">بورسعيد</option>
                        <option value="الإسماعيلية">الإسماعيلية</option>
                        <option value="السويس">السويس</option>
                        <option value="شمال سيناء">شمال سيناء</option>
                        <option value="جنوب سيناء">جنوب سيناء</option>
                        <option value="أسيوط">أسيوط</option>
                        <option value="سوهاج">سوهاج</option>
                        <option value="قنا">قنا</option>
                        <option value="الأقصر">الأقصر</option>
                        <option value="أسوان">أسوان</option>
                        <option value="الفيوم">الفيوم</option>
                        <option value="بني سويف">بني سويف</option>
                        <option value="المنيا">المنيا</option>
                        <option value="الوادي الجديد">الوادي الجديد</option>
                        <option value="مطروح">مطروح</option>
                        <option value="البحر الأحمر">البحر الأحمر</option>
                    </select>
                </div>

                <!-- المدرسة -->
                <div class="form-group">
                    <label for="school">
                        <span class="required">*</span>
                        🏫 المدرسة
                    </label>
                    <input type="text" id="school" name="school" required placeholder="أدخل اسم المدرسة">
                </div>

                <!-- المرحلة -->
                <div class="form-group">
                    <label for="stage">
                        <span class="required">*</span>
                        🎓 المرحلة الدراسية
                    </label>
                    <select id="stage" name="stage" required>
                        <option value="">اختر المرحلة</option>
                        <option value="ابتدائي">ابتدائي</option>
                        <option value="اعدادي">اعدادي</option>
                        <option value="ثانوي">ثانوي</option>
                    </select>
                </div>

                <!-- المادة -->
                <div class="form-group">
                    <label for="subject">
                        <span class="required">*</span>
                        📚 المادة (يمكن اختيار أكثر من مادة)
                    </label>
                    <select id="subject" name="subject" multiple required size="3">
                        <option value="حاسب آلي (عربي)">💻 حاسب آلي (عربي)</option>
                        <option value="حاسب آلي لغات">💻 حاسب آلي لغات</option>
                        <option value="رياضيات">📐 رياضيات</option>
                    </select>
                    <small style="display: block; margin-top: 5px; color: #666;">
                        💡 اضغط Ctrl (أو Cmd في Mac) لاختيار أكثر من مادة
                    </small>
                </div>

                <!-- النظام -->
                <div class="form-group">
                    <label for="system">
                        <span class="required">*</span>
                        ⚙️ نظام التدريس
                    </label>
                    <select id="system" name="system" required>
                        <option value="">اختر نظام التدريس</option>
                        <option value="عربي">عربي</option>
                        <option value="لغات">لغات</option>
                        <option value="توجيه">توجيه</option>
                    </select>
                </div>

                <!-- البريد الإلكتروني -->
                <div class="form-group">
                    <label for="email">
                        <span class="required">*</span>
                        📧 البريد الإلكتروني
                    </label>
                    <input type="email" id="email" name="email" required placeholder="example@email.com">
                </div>

                <!-- الموافقة -->
                <div class="form-group">
                    <div class="checkbox-group">
                        <input type="checkbox" id="agree" name="agree" required>
                        <label for="agree">
                            <span class="required">*</span>
                            ✅ أوافق على الشروط والأحكام
                        </label>
                    </div>
                </div>

                <!-- زر الإرسال -->
                <button type="submit" id="submitBtn">🚀 إرسال البيانات</button>
                <div class="loading" id="loadingMessage">⏳ جاري الإرسال</div>
            </form>
        </div>
    </div>

    <script>
        console.log("✅ تم تحميل JavaScript بنجاح!");
        
        // ⚠️⚠️⚠️ مهم جداً: ضع رابط Web App هنا ⚠️⚠️⚠️
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycby9-8hf942Vzkwf-Tjf5S2zWNIk7iR2xAioEeare3dAHeNeSpscy8H9aMYFce2jvdeb/exec";

        console.log("🔗 Web App URL:", WEB_APP_URL);

        const form = document.getElementById('registrationForm');
        const submitBtn = document.getElementById('submitBtn');
        const loadingMessage = document.getElementById('loadingMessage');
        const successMessage = document.getElementById('successMessage');
        const errorMessage = document.getElementById('errorMessage');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            console.log("📝 تم الضغط على زر الإرسال");

            // تحقق من وضع الرابط
            if (WEB_APP_URL === "YOUR_WEB_APP_URL_HERE") {
                alert("⚠️ يرجى وضع رابط Web App في الكود أولاً!");
                return;
            }

            // إخفاء الرسائل السابقة
            successMessage.style.display = 'none';
            errorMessage.style.display = 'none';

            // تعطيل زر الإرسال وإظهار رسالة التحميل
            submitBtn.disabled = true;
            loadingMessage.style.display = 'block';

            // جمع المواد المختارة
            const subjectSelect = document.getElementById('subject');
            const selectedSubjects = Array.from(subjectSelect.selectedOptions).map(option => option.value);
            
            // ⚠️ مهم جداً: الأسماء بالعربي تماماً كما في Apps Script
            const formData = {
                "الاسم": document.getElementById('name').value.trim(),
                "العنوان": document.getElementById('address').value.trim(),
                "رقم الهاتف": document.getElementById('phone').value.trim(),
                "المحافظة": document.getElementById('governorate').value,
                "المدرسة": document.getElementById('school').value.trim(),
                "المرحلة": document.getElementById('stage').value,
                "المادة": selectedSubjects.join(', '),
                "النظام": document.getElementById('system').value,
                "الموافقة": document.getElementById('agree').checked ? 'نعم' : 'لا',
                "البريد الإلكتروني": document.getElementById('email').value.trim()
            };

            console.log("📦 البيانات المُرسلة:");
            console.log(JSON.stringify(formData, null, 2));

            try {
                console.log("🚀 جاري الإرسال إلى:", WEB_APP_URL);
                
                const response = await fetch(WEB_APP_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(formData)
                });

                console.log("✅ تم الإرسال بنجاح!");
                console.log("💡 تحقق من Google Sheets:");
                console.log("   1. الشيت الرئيسي (Form Responses)");
                console.log("   2. شيت المحافظة (" + formData['المحافظة'] + ")");
                
                successMessage.style.display = 'block';
                form.reset();
                window.scrollTo({ top: 0, behavior: 'smooth' });

                setTimeout(() => {
                    successMessage.style.display = 'none';
                }, 5000);

            } catch (error) {
                console.error('❌ خطأ:', error);
                errorMessage.style.display = 'block';
                window.scrollTo({ top: 0, behavior: 'smooth' });

                setTimeout(() => {
                    errorMessage.style.display = 'none';
                }, 5000);
            } finally {
                submitBtn.disabled = false;
                loadingMessage.style.display = 'none';
            }
        });

        // التحقق من رقم الهاتف المصري
        document.getElementById('phone').addEventListener('input', function(e) {
            let value = e.target.value.replace(/\D/g, '');
            e.target.value = value;
        });

        console.log("✅ كل شيء جاهز!");
        console.log("💡 تأكد من وضع رابط Web App في المكان المحدد!");
        console.log("📋 الأسماء في الفورم متطابقة مع Apps Script:");
        console.log("   ✅ الاسم, العنوان, رقم الهاتف, المحافظة, المدرسة");
        console.log("   ✅ المرحلة, المادة, النظام, الموافقة, البريد الإلكتروني");
    </script>
</body>
</html>
